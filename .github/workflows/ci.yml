name: HostShell CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostshell-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression:
    name: Full regression (macOS + iOS)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prefer rustup toolchain for Cargo commands
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for group in data["devices"].values() for device in group
                     if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]
          if not devices:
              raise SystemExit("No available iPhone simulator is installed on this runner")
          print(devices[0]["udid"])
          ')"
          echo "HOSTSHELL_IOS_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run full regression baseline
        run: ./scripts/check_regression.sh

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        run: git show --check --oneline "${{ github.sha }}"

  release:
    name: Build and publish macOS app + CLI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: regression
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prefer rustup toolchain for Cargo commands
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify release tag and set app version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CLI_VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "hostshell-cli"))')"
          if [[ "$VERSION" != "$CLI_VERSION" ]]; then
            echo "Tag version $VERSION does not match hostshell-cli Cargo version $CLI_VERSION" >&2
            exit 1
          fi
          echo "HOSTSHELL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HOSTSHELL_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build CLI
        run: ./scripts/build_cli.sh

      - name: Build macOS app
        run: ./scripts/build_macos.sh

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/HostShell.app dist/HostShell-macos.zip
          DMG_ROOT="$RUNNER_TEMP/hostshell-dmg-root"
          mkdir -p "$DMG_ROOT"
          ditto target/HostShell.app "$DMG_ROOT/HostShell.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          cat > "$DMG_ROOT/安装说明.txt" <<'EOF'
          安装：将 HostShell.app 拖动到 Applications 图标。
          首次打开若被 macOS 拦截，请在“系统设置 > 隐私与安全性”中确认打开。

          Install: Drag HostShell.app onto the Applications icon.
          If macOS blocks the first launch, allow it in System Settings > Privacy & Security.
          EOF
          hdiutil create -volname HostShell -srcfolder "$DMG_ROOT" -ov -format UDZO "$RUNNER_TEMP/HostShell-macos.dmg"
          cp "$RUNNER_TEMP/HostShell-macos.dmg" dist/HostShell-macos.dmg
          tar -C target/release -czf dist/hostshell-cli-macos.tar.gz hostshell-cli
          printf 'version=%s\narchitecture=%s\n' "${GITHUB_REF_NAME#v}" "$(uname -m)" > dist/BUILD-INFO.txt
          shasum -a 256 dist/HostShell-macos.dmg dist/HostShell-macos.zip dist/hostshell-cli-macos.tar.gz dist/BUILD-INFO.txt > dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/HostShell-macos.dmg
          dist/HostShell-macos.zip
          dist/hostshell-cli-macos.tar.gz
          dist/BUILD-INFO.txt
          dist/SHA256SUMS
          --title "HostShell ${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag
