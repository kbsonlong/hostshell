name: HostShell CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hostshell-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression:
    name: Full regression (macOS + iOS)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prefer rustup toolchain for Cargo commands
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for group in data["devices"].values() for device in group
                     if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]
          if not devices:
              raise SystemExit("No available iPhone simulator is installed on this runner")
          print(devices[0]["udid"])
          ')"
          echo "HOSTSHELL_IOS_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run full regression baseline
        run: ./scripts/check_regression.sh

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        run: git show --check --oneline "${{ github.sha }}"

  release:
    name: Build and publish macOS app + CLI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: regression
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prefer rustup toolchain for Cargo commands
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build CLI
        run: ./scripts/build_cli.sh

      - name: Build macOS app
        run: ./scripts/build_macos.sh

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/HostShell.app dist/HostShell-macos.zip
          tar -C target/release -czf dist/hostshell-cli-macos.tar.gz hostshell-cli
          printf 'version=%s\narchitecture=%s\n' "${GITHUB_REF_NAME#v}" "$(uname -m)" > dist/BUILD-INFO.txt
          shasum -a 256 dist/HostShell-macos.zip dist/hostshell-cli-macos.tar.gz dist/BUILD-INFO.txt > dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/HostShell-macos.zip
          dist/hostshell-cli-macos.tar.gz
          dist/BUILD-INFO.txt
          dist/SHA256SUMS
          --title "HostShell ${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag
