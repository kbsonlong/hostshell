name: HostShell CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and publish through CI (leave empty for regression only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hostshell-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression:
    name: Full regression (macOS + iOS)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prefer rustup toolchain for Cargo commands
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for group in data["devices"].values() for device in group
                     if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]
          if not devices:
              raise SystemExit("No available iPhone simulator is installed on this runner")
          print(devices[0]["udid"])
          ')"
          echo "HOSTSHELL_IOS_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run full regression baseline
        run: ./scripts/check_regression.sh

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        run: git show --check --oneline "${{ github.sha }}"

  release-build:
    name: Build macOS + CLI (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            expected_arch: arm64
          - arch: amd64
            runner: macos-15-intel
            expected_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prefer rustup toolchain for Cargo commands
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify release tag and set app version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(uname -m)" != "$EXPECTED_ARCH" ]]; then
            echo "Runner architecture $(uname -m) does not match $EXPECTED_ARCH" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          CLI_VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "hostshell-cli"))')"
          if [[ "$VERSION" != "$CLI_VERSION" ]]; then
            echo "Tag version $VERSION does not match hostshell-cli Cargo version $CLI_VERSION" >&2
            exit 1
          fi
          echo "HOSTSHELL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HOSTSHELL_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build CLI
        run: ./scripts/build_cli.sh

      - name: Build macOS app
        run: ./scripts/build_macos.sh

      - name: Package release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APP_NAME="HostShell-macos-${RELEASE_ARCH}"
          CLI_NAME="hostshell-cli-macos-${RELEASE_ARCH}"
          ditto -c -k --sequesterRsrc --keepParent target/HostShell.app "dist/${APP_NAME}.zip"
          DMG_ROOT="$RUNNER_TEMP/hostshell-dmg-root-${RELEASE_ARCH}"
          mkdir -p "$DMG_ROOT"
          ditto target/HostShell.app "$DMG_ROOT/HostShell.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          cat > "$DMG_ROOT/安装说明.txt" <<'EOF'
          安装：将 HostShell.app 拖动到 Applications 图标。
          首次打开若被 macOS 拦截，请在“系统设置 > 隐私与安全性”中确认打开。

          Install: Drag HostShell.app onto the Applications icon.
          If macOS blocks the first launch, allow it in System Settings > Privacy & Security.
          EOF
          hdiutil create -volname "HostShell ${RELEASE_ARCH}" -srcfolder "$DMG_ROOT" -ov -format UDZO "$RUNNER_TEMP/${APP_NAME}.dmg"
          cp "$RUNNER_TEMP/${APP_NAME}.dmg" "dist/${APP_NAME}.dmg"
          tar -C target/release -czf "dist/${CLI_NAME}.tar.gz" hostshell-cli
          printf 'version=%s\narchitecture=%s\n' "${RELEASE_TAG#v}" "$RELEASE_ARCH" > "dist/BUILD-INFO-${RELEASE_ARCH}.txt"
          shasum -a 256 dist/* > "dist/SHA256SUMS-${RELEASE_ARCH}"

      - name: Upload architecture assets
        uses: actions/upload-artifact@v4
        with:
          name: hostshell-release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [regression, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download both architecture builds
        uses: actions/download-artifact@v4
        with:
          pattern: hostshell-release-*
          merge-multiple: true
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "HostShell ${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
          fi
